[package]
name = "shaper"
version = "0.1.0"
edition = "2024"
description = "Small and simple template manager."
authors = ["ksjuas"]
repository = "https://github.com/notseriouss/shaper"
readme = "README.md"
keywords = ["cli", "tui", "shaper", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
log = "0.4.33"
thiserror = "2.0.20"
fs_extra = "1.3.0"
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
